# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
minor_changes:
  - Added the `o0_o.utils.truthy_or_integer` filter that prefers integer
    literals while still handling Ansible boolean strings, plus options to
    map zero to false and to require positive integers.
  - Added the `o0_o.utils.lines2items` filter as a thin wrapper around
    Python's `splitlines()` for converting multi-line text into lists,
    with a `splitlines` alias for familiarity.
  - Added the `o0_o.utils.items2dict` filter with configurable key/value
    field names (including key fallbacks), collision behaviour, default
    values, and optional deep combines via the `combine` filter.
  - Added the `o0_o.utils.dict2items` filter that mirrors the extended
    behaviour of `items2dict`, supporting the same key fallback logic,
    default values, and collision handling.
  - Added the `o0_o.utils.rekey` filter that re-keys dictionaries using
    the shared helpers, including key fallbacks, optional preservation of
    the original key, default value support, and collision controls.
