name: Docs

'on':
  pull_request:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core and doc requirements
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          pip install -r docs/requirements.txt

      - name: Build collection artifact
        run: ansible-galaxy collection build

      - name: Install built collection (with deps)
        run: |
          # Install the freshly built collection tarball so antsibull-docs
          # can locate and document it via ansible-doc
          ansible-galaxy collection install ./*.tar.gz --force

      - name: Build docs
        run: make -C docs html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: utils-docs-html
          path: docs/_build/html

  deploy:
    name: Deploy Docs to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install doc requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build docs
        run: make -C docs html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
