name: CI

'on':
  pull_request:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-collection-tarball
          path: '*.tar.gz'

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built collection
        uses: actions/download-artifact@v4
        with:
          name: ansible-collection-tarball
          path: ./build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install built collection (with dependencies)
        run: |
          ansible-galaxy collection install ./build/o0_o-utils-*.tar.gz \
            --force -p ~/.ansible/collections -vvv

      - name: Run sanity tests
        run: |
          cd ~/.ansible/collections/ansible_collections/o0_o/utils
          ansible-test sanity --venv -v

      - name: Run unit tests
        run: |
          cd ~/.ansible/collections/ansible_collections/o0_o/utils
          ansible-test units --venv -v

      - name: Run integration tests
        run: |
          cd ~/.ansible/collections/ansible_collections/o0_o/utils
          ansible-test integration --venv -v

  build:
    # Repurposed above; keep publish job depending on test

  publish:
    name: Publish to Galaxy
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-collection-tarball

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          pip install --upgrade pip
          pip install ansible-core

      - name: Publish to Galaxy
        run: >-
          ansible-galaxy collection publish *.tar.gz
          --token ${{ secrets.GALAXY_API_KEY }}
