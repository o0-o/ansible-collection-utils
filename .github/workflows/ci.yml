name: CI

'on':
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          pip install --upgrade pip
          pip install ansible-core

      - name: Setup collection structure
        run: |
          mkdir -p ~/.ansible/collections/ansible_collections/o0_o
          cp -r . ~/.ansible/collections/ansible_collections/o0_o/utils
          cd ~/.ansible/collections/ansible_collections/o0_o/utils

      - name: Run sanity tests
        working-directory: >-
          /home/runner/.ansible/collections/ansible_collections/o0_o/utils
        run: ansible-test sanity --docker -v

      - name: Run unit tests
        working-directory: >-
          /home/runner/.ansible/collections/ansible_collections/o0_o/utils
        run: ansible-test units --docker -v

      - name: Run integration tests
        working-directory: >-
          /home/runner/.ansible/collections/ansible_collections/o0_o/utils
        run: ansible-test integration --docker -v

  build:
    name: Build Collection
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          pip install --upgrade pip
          pip install ansible-core

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-tarball
          path: '*.tar.gz'

  publish:
    name: Publish to Galaxy
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: collection-tarball

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-core
        run: |
          pip install --upgrade pip
          pip install ansible-core

      - name: Publish to Galaxy
        run: >-
          ansible-galaxy collection publish *.tar.gz
          --token ${{ secrets.GALAXY_API_KEY }}
