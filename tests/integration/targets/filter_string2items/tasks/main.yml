- name: Test string2items filter with default parameters
  ansible.builtin.assert:
    that:
      - "'foo,bar,baz' | o0_o.utils.string2items == ['foo', 'bar', 'baz']"
      - >-
        'foo, bar, baz' | o0_o.utils.string2items ==
        ['foo', 'bar', 'baz']
      - >-
        '  foo  ,  bar  ,  baz  ' | o0_o.utils.string2items ==
        ['foo', 'bar', 'baz']

- name: Test string2items filter with empty string
  ansible.builtin.assert:
    that:
      - "'' | o0_o.utils.string2items == []"
      - "'' | o0_o.utils.string2items(',', false) == ['']"

- name: Test string2items filter with custom delimiters
  ansible.builtin.assert:
    that:
      - "'foo|bar|baz' | o0_o.utils.string2items('|') == ['foo', 'bar', 'baz']"
      - "'foo;bar;baz' | o0_o.utils.string2items(';') == ['foo', 'bar', 'baz']"
      - "'foo bar baz' | o0_o.utils.string2items(' ') == ['foo', 'bar', 'baz']"
      - >-
        'foo::bar::baz' | o0_o.utils.string2items('::') ==
        ['foo', 'bar', 'baz']

- name: Test string2items filter with trim parameter
  ansible.builtin.assert:
    that:
      - >-
        'foo, bar , baz' | o0_o.utils.string2items(',', true) ==
        ['foo', 'bar', 'baz']
      - >-
        'foo, bar , baz' | o0_o.utils.string2items(',', false) ==
        ['foo', ' bar ', ' baz']
      - "',foo,bar,' | o0_o.utils.string2items(',', true) == ['foo', 'bar']"
      - >-
        ',foo,bar,' | o0_o.utils.string2items(',', false) ==
        ['', 'foo', 'bar', '']

- name: Test string2items filter with empty items
  ansible.builtin.assert:
    that:
      - "'foo,,bar' | o0_o.utils.string2items(',', true) == ['foo', 'bar']"
      - >-
        'foo,,bar' | o0_o.utils.string2items(',', false) ==
        ['foo', '', 'bar']
      - "',,,' | o0_o.utils.string2items(',', true) == []"
      - "',,,' | o0_o.utils.string2items(',', false) == ['', '', '', '']"

- name: Test string2items filter with single item
  ansible.builtin.assert:
    that:
      - "'foo' | o0_o.utils.string2items == ['foo']"
      - "'foo' | o0_o.utils.string2items('|') == ['foo']"

- name: Test string2items filter with numeric input
  vars:
    num_var: 123
    float_var: 3.14
  ansible.builtin.assert:
    that:
      - "num_var | o0_o.utils.string2items == ['123']"
      - "float_var | o0_o.utils.string2items == ['3.14']"

- name: Test string2items filter with boolean input
  vars:
    true_var: true
    false_var: false
  ansible.builtin.assert:
    that:
      - "true_var | o0_o.utils.string2items == ['True']"
      - "false_var | o0_o.utils.string2items == ['False']"

- name: Test string2items filter in practical use case
  vars:
    server_list: "web01.example.com, web02.example.com, db01.example.com"
    path_list: "/usr/bin:/usr/local/bin:/opt/bin"
    tags_string: "production;web;critical"
  ansible.builtin.assert:
    that:
      - >-
        server_list | o0_o.utils.string2items ==
        ['web01.example.com', 'web02.example.com', 'db01.example.com']
      - >-
        path_list | o0_o.utils.string2items(':') ==
        ['/usr/bin', '/usr/local/bin', '/opt/bin']
      - >-
        tags_string | o0_o.utils.string2items(';') ==
        ['production', 'web', 'critical']

- name: Test string2items filter with special characters
  ansible.builtin.assert:
    that:
      - "'foo@bar,baz#qux' | o0_o.utils.string2items == ['foo@bar', 'baz#qux']"
      - "'a=1,b=2,c=3' | o0_o.utils.string2items == ['a=1', 'b=2', 'c=3']"

- name: Test string2items filter with whitespace-only strings
  ansible.builtin.assert:
    that:
      - "'   ,   ,   ' | o0_o.utils.string2items(',', true) == []"
      - >-
        '   ,   ,   ' | o0_o.utils.string2items(',', false) ==
        ['   ', '   ', '   ']

- name: Test string2items filter with tab delimiter
  vars:
    tab_string: "foo\tbar\tbaz"
  ansible.builtin.assert:
    that:
      - "tab_string | o0_o.utils.string2items('\t') == ['foo', 'bar', 'baz']"

- name: Test string2items filter chaining with other filters
  vars:
    raw_input: " alpha, beta, gamma "
  ansible.builtin.assert:
    that:
      - >-
        raw_input | o0_o.utils.string2items | map('upper') | list ==
        ['ALPHA', 'BETA', 'GAMMA']
      - "raw_input | o0_o.utils.string2items | length == 3"
      - "raw_input | o0_o.utils.string2items | first == 'alpha'"
      - "raw_input | o0_o.utils.string2items | last == 'gamma'"

- name: Test string2items filter with environment variables simulation
  vars:
    env_path: "/home/user/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  ansible.builtin.assert:
    that:
      - "env_path | o0_o.utils.string2items(':') | length == 7"
      - "'/home/user/bin' in (env_path | o0_o.utils.string2items(':'))"
      - "'/usr/local/bin' in (env_path | o0_o.utils.string2items(':'))"
