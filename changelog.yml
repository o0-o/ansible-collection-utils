# vim: ts=2:sw=2:sts=2:et:ft=yaml
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
releases:

  v1.0.0:
    changes:
      added:
        - Initial release of the o0_o.utils Ansible Collection.
        - New `hostname` filter for parsing and structuring hostnames.
        - Support for Unicode/IDN hostnames with automatic Punycode
          conversion.
        - Extraction of hostname components (short, long, domain, TLD,
          eTLD, registered domain, FQDN).
        - Label parsing using dnspython for validation.
        - Public Suffix List integration via tldextract for accurate
          eTLD detection.
        - Comprehensive unit and integration test coverage.
        - CI/CD pipeline using GitHub Actions with Docker-based testing.